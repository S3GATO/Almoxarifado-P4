<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle do Almoxarifado</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #f4f4f3;
            color: #3e3f3a;
        }
        .container {
            max-width: 1400px;
            margin: 20px auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.08);
            min-height: calc(100vh - 40px);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .header {
            background: #84836d; /* Verde-oliva oficial */
            color: #fcfaf2;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid #d4c592; /* Ouro heráldico */
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .logo h1 {
            font-size: 28px;
            font-weight: bold;
            color: #fcfaf2;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }
        .header-right {
            font-weight: 500;
            font-size: 14px;
            color: #fcfaf2;
        }
        .main { 
            display: flex; 
            flex: 1; 
        }
        .sidebar {
            width: 280px;
            background: #f9f8f3;
            border-right: 1px solid #e5e3d7;
            padding-top: 20px;
        }
        .menu-btn {
            width: 100%;
            padding: 16px 28px;
            border: none;
            background: none;
            text-align: left;
            font-size: 16px;
            color: #5c5b4f;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.2s ease;
        }
        .menu-btn:hover { background: #ebdcb9; color: #4b4b3e; }
        .menu-btn.active { 
            background: #84836d; 
            color: white; 
            font-weight: 600;
            border-left: 5px solid #d4c592;
        }
        
        .content {
            flex: 1;
            padding: 30px;
            background: #ffffff;
        }
        .content h2 {
            margin-bottom: 20px;
            color: #4b4b3e;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 12px rgba(132,131,109,0.06);
            margin-bottom: 24px;
            border: 1px solid #edf0ea;
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #5c5b4f; }
        input, select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e5e3d7;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus, select:focus {
            border-color: #84836d;
        }
        .btn {
            background: #84836d;
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.2s;
        }
        .btn:hover { background: #6e6d59; }
        
        .btn-print {
            background: #3e3f3a;
            margin-left: 10px;
        }
        .btn-print:hover { background: #252622; }

        .btn-import {
            background: #d4c592; 
            color: #4b4b3e;
            font-weight: 700;
            margin-top: 0;
            border: 1px solid #bdae7c;
            display: inline-flex;
            align-items: center;
            cursor: pointer;
            padding: 14px 24px;
            border-radius: 8px;
        }
        .btn-import:hover { background: #c4b583; }
        
        .table-container {
            overflow-x: auto;
        }
        .table {
            width: 100%;
            border-collapse: collapse;
        }
        .table th, .table td {
            padding: 14px 16px;
            text-align: left;
            border-bottom: 1px solid #e5e3d7;
        }
        .table th { background: #84836d; color: white; font-weight: 600; }
        .table tr:hover { background: #fbfbfa; }

        /* Inputs específicos para o modo de edição dentro da tabela */
        .input-edicao {
            padding: 6px 10px;
            font-size: 14px;
            border: 1px solid #84836d;
            border-radius: 4px;
            width: 100%;
        }

        .btn-acao {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            padding: 4px 8px;
            border-radius: 4px;
            transition: background 0.2s;
        }
        .btn-editar:hover { background: #fef3c7; }
        .btn-excluir:hover { background: #fee2e2; }
        .btn-salvar:hover { background: #dcfce7; }
        .btn-cancelar:hover { background: #f3f4f6; }

        .guia {
            background: white;
            border: 2px solid #84836d;
            padding: 35px;
            margin: 20px auto;
            max-width: 950px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.05);
            font-family: Arial, Helvetica, sans-serif;
        }

        /* CONFIGURAÇÃO EXCLUSIVA PARA IMPRESSÃO DE PAPEL E SALVAMENTO EM PDF */
        @media print {
            body, .container, .main, .content {
                display: block !important;
                overflow: visible !important;
                height: auto !important;
                min-height: auto !important;
                margin: 0 !important;
                padding: 0 !important;
                background: white !important;
                color: black !important;
                box-shadow: none !important;
            }
            .header, .sidebar, .btn, .btn-import, .btn-print, #busca-estoque, .btn-acao { 
                display: none !important; 
            }
            .card {
                border: none !important;
                box-shadow: none !important;
                padding: 10px 0 !important;
                margin-bottom: 10px !important;
                display: block !important;
            }
            .table-container {
                overflow: visible !important;
            }
            .table th {
                background: #5c5b4f !important;
                color: white !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            .guia { 
                display: block !important; 
                border: 2px solid #000 !important; 
                margin: 0 !important; 
                padding: 20px !important;
                max-width: 100% !important;
                width: 100% !important;
                box-shadow: none !important;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="logo">
                <img src="logo-brigada.png" alt="Brigada Militar" style="height: 65px; margin-right: 12px;" onerror="this.style.display='none'">
                <h1>Controle do Almoxarifado</h1>
            </div>
            <div class="header-right">
                <span id="data-atual"></span>
            </div>
        </header>

        <div class="main">
            <aside class="sidebar">
                <nav>
                    <button onclick="navegar(0)" class="menu-btn active" id="menu-0">📋 Estoque Atual</button>
                    <button onclick="navegar(5)" class="menu-btn" id="menu-5">💰 Guia de Pagamento</button>
                    <button onclick="navegar(3)" class="menu-btn" id="menu-3">📊 Relatórios</button>
                </nav>
            </aside>
            <main class="content" id="conteudo"></main>
        </div>
    </div>

    <script>
        let db = { itens: [], movimentacoes: [] };
        let idItemEmEdicao = null; // Controla qual linha está sendo editada de cada vez

        function carregarDB() {
            const salvo = localStorage.getItem('almoxarifado');
            if (salvo) {
                db = JSON.parse(salvo);
                if (!db.movimentacoes) db.movimentacoes = [];
            } else {
                db.itens = [
                    { id: 1, categoria: "Teclado", marca: "Logitech", descricao: "Teclado Mecânico K380", patrimonio: "PAT-2026001", quantidade: 12, status: "Em estoque" },
                    { id: 2, categoria: "Monitor", marca: "Dell", descricao: "Monitor 24\"", patrimonio: "PAT-2026002", quantidade: 5, status: "Em estoque" }
                ];
                db.movimentacoes = [];
                salvarDB();
            }
        }

        function salvarDB() {
            localStorage.setItem('almoxarifado', JSON.stringify(db));
        }

        function registrarMovimentacao(tipo, descricaoItem) {
            db.movimentacoes.unshift({
                data: new Date().toISOString(),
                tipo: tipo,
                item: descricaoItem
            });
            salvarDB();
        }

        function navegar(tela) {
            idItemEmEdicao = null; // Reseta o estado de edição ao mudar de aba
            document.querySelectorAll('.menu-btn').forEach(b => b.classList.remove('active'));
            const btnAtivo = document.getElementById(`menu-${tela}`);
            if(btnAtivo) btnAtivo.classList.add('active');

            const conteudo = document.getElementById('conteudo');
            conteudo.innerHTML = '';

            if (tela === 0) renderizarEstoque(conteudo);
            else if (tela === 3) renderizarRelatorios(conteudo);
            else if (tela === 5) renderizarGuiaPagamento(conteudo);
        }

        // ====================== ESTOQUE COM IMPORTAÇÃO REAL ======================
        function renderizarEstoque(container) {
            let html = `
                <h2>📋 Estoque Atual</h2>
                <div class="card" style="margin-bottom:20px; display: flex; gap: 15px; align-items: center;">
                    <input type="text" id="busca-estoque" placeholder="🔍 Buscar item por descrição ou marca..." 
                           style="flex: 1; padding:14px;" onkeyup="filtrarEstoque()">
                    
                    <label class="btn-import">
                        📥 Importar CSV
                        <input type="file" id="inputCSV" accept=".csv" style="display: none;">
                    </label>
                </div>
                <div class="card table-container">
                    <table class="table" id="tabela-estoque">
                        <thead>
                            <tr>
                                <th>Categoria</th>
                                <th>Descrição</th>
                                <th>Marca</th>
                                <th>Patrimônio</th>
                                <th>Quantidade</th>
                                <th>Status</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="tbody-estoque"></tbody>
                    </table>
                </div>`;
            container.innerHTML = html;
            atualizarTabelaEstoque();
            configurarLeitorCSV();
        }

        function processarCSV(conteudoCSV) {
            if (!conteudoCSV || typeof conteudoCSV !== 'string') {
                alert("Erro: Conteúdo do arquivo CSV inválido ou vazio.");
                return;
            }

            const linhas = conteudoCSV.split(/\r?\n/).filter(linha => linha.trim() !== '');

            if (linhas.length <= 1) {
                alert("O arquivo CSV está vazio ou contém apenas a linha de cabeçalho.");
                return;
            }

            const separador = linhas[0].includes(';') ? ';' : ',';
            let itensImportados = 0;

            for (let i = 1; i < linhas.length; i++) {
                const colunas = linhas[i]
                    .split(separador)
                    .map(col => col.replace(/^"(.*)"$/, '$1').trim());

                if (colunas.length >= 5) {
                    const quantidade = parseInt(colunas[4], 10) || 0;
                    const patrimonio = colunas[3] || 'N/A';

                    const novoItem = {
                        id: Date.now() + i,
                        categoria: colunas[0] || 'Geral',
                        descricao: colunas[1] || 'Sem descrição',
                        marca: colunas[2] || '-',
                        patrimonio: patrimonio,
                        quantidade: quantidade,
                        status: quantidade > 0 ? "Em estoque" : "Esgotado"
                    };

                    db.itens.push(novoItem);
                    itensImportados++;
                }
            }

            if (itensImportados > 0) {
                salvarDB();
                registrarMovimentacao("Importação", `${itensImportados} itens importados via arquivo CSV.`);
                alert(`✅ Sucesso! ${itensImportados} itens foram importados com êxito.`);
                atualizarTabelaEstoque();
            } else {
                alert("⚠️ Nenhum item válido pôde ser extraído do arquivo CSV.");
            }
        }

        function configurarLeitorCSV() {
            const inputCSV = document.getElementById('inputCSV');
            if (inputCSV) {
                inputCSV.addEventListener('change', function(event) {
                    const arquivo = event.target.files[0];
                    if (!arquivo) return;

                    const leitor = new FileReader();
                    leitor.readAsText(arquivo, 'UTF-8');
                    
                    leitor.onload = function(e) {
                        processarCSV(e.target.result);
                    };

                    leitor.onerror = function() {
                        alert("Erro ao tentar ler o arquivo selecionado.");
                    };
                });
            }
        }

        function atualizarTabelaEstoque(filtro = '') {
            const tbody = document.getElementById('tbody-estoque');
            if(!tbody) return;
            
            const termo = filtro.toLowerCase();
            let html = '';

            const filtrados = db.itens.filter(item => 
                item.descricao.toLowerCase().includes(termo) || 
                item.marca.toLowerCase().includes(termo) ||
                item.categoria.toLowerCase().includes(termo)
            );

            if(filtrados.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;padding:40px;color:#8c8a79;">Nenhum item encontrado.</td></tr>`;
                return;
            }

            filtrados.forEach(item => {
                if (idItemEmEdicao === item.id) {
                    // LINHA EM MODO DE EDIÇÃO (INPUTS)
                    html += `<tr>
                        <td><input type="text" id="edit-cat-${item.id}" class="input-edicao" value="${item.categoria}"></td>
                        <td><input type="text" id="edit-desc-${item.id}" class="input-edicao" value="${item.descricao}"></td>
                        <td><input type="text" id="edit-marca-${item.id}" class="input-edicao" value="${item.marca}"></td>
                        <td><input type="text" id="edit-pat-${item.id}" class="input-edicao" value="${item.patrimonio}"></td>
                        <td><input type="number" id="edit-qtd-${item.id}" class="input-edicao" value="${item.quantidade}" style="width:70px;"></td>
                        <td><span style="color:#b45309;font-weight:600;">Editando...</span></td>
                        <td>
                            <button onclick="salvarEdicao(${item.id})" class="btn-acao btn-salvar" title="Salvar Alterações">💾</button>
                            <button onclick="cancelarEdicao()" class="btn-acao btn-cancelar" title="Cancelar">❌</button>
                        </td>
                    </tr>`;
                } else {
                    // LINHA EM MODO VISUALIZAÇÃO PADRÃO
                    html += `<tr>
                        <td><strong>${item.categoria}</strong></td>
                        <td>${item.descricao}</td>
                        <td>${item.marca}</td>
                        <td>${item.patrimonio}</td>
                        <td style="font-weight:600;color:#84836d;">${item.quantidade}</td>
                        <td><span style="background:#eef0eb;color:#84836d;padding:6px 12px;border-radius:9999px;font-size:14px;font-weight:600;border: 1px solid #d6dad0;">${item.status}</span></td>
                        <td>
                            <button onclick="ativarEdicao(${item.id})" class="btn-acao btn-editar" title="Editar Item">✏️</button>
                            <button onclick="excluirItem(${item.id})" class="btn-acao btn-excluir" title="Excluir Item">🗑️</button>
                        </td>
                    </tr>`;
                }
            });

            tbody.innerHTML = html;
        }

        // Funções de Controle da Edição
        function ativarEdicao(id) {
            idItemEmEdicao = id;
            const termoBusca = document.getElementById('busca-estoque')?.value || '';
            atualizarTabelaEstoque(termoBusca);
        }

        function cancelarEdicao() {
            idItemEmEdicao = null;
            const termoBusca = document.getElementById('busca-estoque')?.value || '';
            atualizarTabelaEstoque(termoBusca);
        }

        function salvarEdicao(id) {
            const novaCat = document.getElementById(`edit-cat-${id}`).value.trim();
            const novaDesc = document.getElementById(`edit-desc-${id}`).value.trim();
            const novaMarca = document.getElementById(`edit-marca-${id}`).value.trim();
            const novoPat = document.getElementById(`edit-pat-${id}`).value.trim();
            const novaQtd = parseInt(document.getElementById(`edit-qtd-${id}`).value) || 0;

            if(!novaDesc) {
                alert("⚠️ A descrição do produto não pode ficar vazia.");
                return;
            }

            const item = db.itens.find(i => i.id === id);
            if (item) {
                registrarMovimentacao("Edição", `Item "${item.descricao}" modificado manualmente.`);
                
                item.categoria = novaCat;
                item.descricao = novaDesc;
                item.marca = novaMarca;
                item.patrimonio = novoPat;
                item.quantidade = novaQtd;
                item.status = novaQtd > 0 ? "Em estoque" : "Esgotado";

                salvarDB();
                idItemEmEdicao = null;
                atualizarTabelaEstoque(document.getElementById('busca-estoque')?.value || '');
                alert("✅ Item atualizado com sucesso!");
            }
        }

        function filtrarEstoque() {
            const termo = document.getElementById('busca-estoque').value;
            atualizarTabelaEstoque(termo);
        }

        function excluirItem(id) {
            if (confirm("Tem certeza que deseja excluir este item?")) {
                const itemDeletado = db.itens.find(i => i.id === id);
                if(itemDeletado) {
                    registrarMovimentacao("Exclusão", `${itemDeletado.descricao} foi removido.`);
                }
                db.itens = db.itens.filter(i => i.id !== id);
                salvarDB();
                atualizarTabelaEstoque(document.getElementById('busca-estoque')?.value || '');
            }
        }

        // ====================== RELATÓRIOS ======================
        function renderizarRelatorios(container) {
            const totalItens = db.itens.length;
            const totalUnidades = db.itens.reduce((sum, i) => sum + (i.quantidade || 0), 0);

            let html = `
                <h2>📊 Relatórios</h2>
                <div style="margin-bottom: 20px; display: flex; gap: 10px;">
                    <button onclick="window.print()" class="btn btn-print" style="margin:0;">🖨️ Salvar Relatório (PDF)</button>
                    <button onclick="exportarMovimentacoesCSV()" class="btn" style="margin:0; background:#d4c592; color:#4b4b3e; border: 1px solid #bdae7c;">📤 Exportar Movimentações (CSV)</button>
                </div>
                <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(220px,1fr)); gap:20px; margin-bottom:20px;">
                    <div class="card" style="background:#84836d;color:white;text-align:center;">
                        <h3 style="font-weight:500; opacity:0.9; font-size:16px;">Total de Itens Cadastrados</h3>
                        <p style="font-size:42px;font-weight:700;margin-top:10px;">${totalItens}</p>
                    </div>
                    <div class="card" style="background:#d4c592;color:#4b4b3e;text-align:center;border: 1px solid #bdae7c;">
                        <h3 style="font-weight:600; font-size:16px;">Total de Produtos em Estoque</h3>
                        <p style="font-size:42px;font-weight:700;margin-top:10px;">${totalUnidades}</p>
                    </div>
                </div>
                <div class="card table-container">
                    <h3 style="margin-bottom:15px;color:#4b4b3e;">Últimas Movimentações</h3>
                    <table class="table">
                        <thead><tr><th>Data</th><th>Tipo</th><th>Descrição</th></tr></thead>
                        <tbody>`;
            
            if (!db.movimentacoes || db.movimentacoes.length === 0) {
                html += `<tr><td colspan="3" style="text-align:center;padding:30px;color:#8c8a79;">Nenhuma movimentação registrada ainda.</td></tr>`;
            } else {
                db.movimentacoes.slice(0,30).forEach(m => {
                    html += `<tr>
                        <td>${new Date(m.data).toLocaleDateString('pt-BR')} ${new Date(m.data).toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'})}</td>
                        <td><strong>${m.tipo}</strong></td>
                        <td>${m.item}</td>
                    </tr>`;
                });
            }
            html += `</tbody></table></div>`;
            container.innerHTML = html;
        }

        function exportarMovimentacoesCSV() {
            if (!db.movimentacoes || db.movimentacoes.length === 0) {
                alert("⚠️ Não há movimentações para exportar.");
                return;
            }
            let csv = "Data;Tipo;Descrição\n";
            db.movimentacoes.forEach(m => {
                const dataFormatada = `${new Date(m.data).toLocaleDateString('pt-BR')} ${new Date(m.data).toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'})}`;
                csv += `"${dataFormatada}";"${m.tipo}";"${m.item}"\n`;
            });
            
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            link.setAttribute("href", url);
            link.setAttribute("download", `movimentacoes_almoxarifado_${new Date().toISOString().slice(0,10)}.csv`);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // ====================== GUIA DE PAGAMENTO COM IMPRESSÃO ======================
        function renderizarGuiaPagamento(container) {
            const hoje = new Date().toISOString().split('T')[0];
            container.innerHTML = `
                <h2>💰 Guia de Pagamento</h2>
                <div class="card">
                    <div class="form-grid">
                        <div><label>Data</label><input type="date" id="data-req" value="${hoje}"></div>
                        <div><label>OPM</label><input type="text" id="opm" value="11°BPM"></div>
                        <div><label>De(a)</label><input type="text" id="de" value="P4-11BPM"></div>
                        <div><label>Ao</label><input type="text" id="ao" value="Chefe do P/4"></div>
                        <div><label>Material / Setor</label><input type="text" id="setor" value="LIMPEZA E ESCRITÓRIO"></div>
                    </div>
                    <button onclick="gerarGuiaPagamento()" class="btn">📄 Gerar Guia de Pagamento</button>
                    <button onclick="window.print()" class="btn btn-print" id="btn-imprimir-guia" style="display:none;">🖨️ Imprimir Guia</button>
                </div>
                <div id="guia-pagamento" class="guia" style="display:none;"></div>
            `;
        }

        function gerarGuiaPagamento() {
            const data = document.getElementById('data-req').value;
            const opm = document.getElementById('opm').value || "11°BPM";
            const de = document.getElementById('de').value || "P4-11BPM";
            const ao = document.getElementById('ao').value || "Chefe do P/4";
            const setor = document.getElementById('setor').value || "LIMPEZA E ESCRITÓRIO";

            const dataExtenso = new Date(data).toLocaleDateString('pt-BR', { day: '2-digit', month: 'long', year: 'numeric' });

            const guiaHTML = `
                <div style="text-align:center; margin-bottom:20px; color:#000;">
                    <h3>ESTADO DO RIO GRANDE DO SUL</h3>
                    <h4>SECRETARIA DA JUSTIÇA E DA SEGURANÇA</h4>
                    <h4>BRIGADA MILITAR</h4>
                    <h4>COMANDO DO POLICIAMENTO DA CAPITAL</h4>
                </div>
